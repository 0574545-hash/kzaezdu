/* Soft UI: объём только у главных действий. Свет сверху слева. */
:root{--cta-top:#117A64;--cta-mid:#0B6E5B;--cta-bot:#09624F;--cta-hi:rgba(255,255,255,.7);--cta-lo:rgba(9,60,48,.26);--cta-lo2:rgba(9,60,48,.16);--cta-t:160ms;--cta-e:cubic-bezier(.2,0,0,1)}

    if (o.status === 'searching') q.push({o, kind:'assign', tag:o.dropped ? 'Клинер отказался' : 'Никто не подтвердил', cls:'p-bad', sub:o.dropped ? esc(o.dropped.who) + ': «' + esc(o.dropped.why) + '» · нужна замена' : 'Нужно назначить вручную'});
    if (o.areaReq && o.areaReq.st === 'op') q.push({o, kind:'area', tag:'Площадь не совпадает', cls:'p-warn', sub:'В карточке ' + OBJ[o.obj].area + ', клинер: ' + o.areaReq.area + ' м²'});
    if (o.areaReq && o.areaReq.st === 'host') q.push({o, kind:'areawait', tag:'Ждём хоста', cls:'p-quiet', sub:'Новая цена по площади ' + o.areaReq.area + ' м²'});
    if (o.status === 'assigned' && isoOf(o) === TODAY && (o.demoLate || leadMin(o) < -CFG.noArriveMin)) q.push({o, kind:'late', tag:'Нет отметки о прибытии', cls:'p-bad', sub:(o.cleaner || '') + ' · начало было в ' + o.time.split('–')[0]});
    if (o.status === 'cleaning' && (o.demoNoRep || leadMin(o) + (toMin(o.time.split('–')[1]) - toMin(o.time.split('–')[0])) < -CFG.noReportMin)) q.push({o, kind:'norep', tag:'Нет отчёта после окна', cls:'p-bad', sub:(o.cleaner || '') + ' · окно до ' + o.time.split('–')[1]});

  });
  return q;
}

const HOST_PHONE = '+7 928 000-45-12';
function findAll(q){ const t = String(q || '').trim().toLowerCase(), dg = t.replace(/\D/g, ''); if (t.length < 2) return null;

  const objs = Object.keys(OBJ).filter(k => has(OBJ[k].name) || has(OBJ[k].addr) || has(OBJ[k].district));
  const cls = Object.keys(CLEANERS).filter(n => has(n) || has(CLEANERS[n].districts));
  const hosts = (dg.length >= 3 && HOST_PHONE.replace(/\D/g, '').includes(dg)) || has('хост') ? [HOST_PHONE] : [];
  return {orders, objs, cls, hosts, n:orders.length + objs.length + cls.length + hosts.length}; }
function findBox(id, q, mob){ const r = findAll(q);

  if (!r) return inp;
  const a = mob ? {o:'om-order', k:'om-obj', c:'om-cl', h:'om-host'} : {o:'op-find-ord', k:'op-find-obj', c:'op-find-cl', h:'op-find-host'};
